<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メニュー</title>
<style>
  :root{--bg:#fff;--fg:#333;--card:#f0f0f0;--hover:#e2e2e2}
  @media (prefers-color-scheme:dark){:root{--bg:#16112e;--fg:#f4f0ff;--card:#2a2548;--hover:#3a3466}}
  body{font-family:sans-serif;max-width:400px;margin:50px auto;padding:0 20px;background:var(--bg);color:var(--fg)}
  h1{font-size:24px}
  ul{list-style:none;padding:0}
  li{margin-bottom:10px}
  a{display:block;padding:12px 16px;background:var(--card);color:var(--fg);text-decoration:none;border-radius:6px}
  a:hover{background:var(--hover)}
  small{display:block;opacity:.65;margin-top:2px}
</style>
</head>
<body>
  <h1>メニュー</h1>
  <ul>
    <li><a href="ink-battle.html">🦑 インクバトル<small>ブキ5種・ボム・最大4vs4のインク塗りバトル</small></a></li>

  </ul>
</body>
</html>
